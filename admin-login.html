<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | Printzy</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="auth-page">


<header class="navbar">

    <a href="index.html" class="brand">
        🖨️ <strong>Printzy</strong>
    </a>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="order.html">
            Order
        </a>

        <a href="staff-login.html">
            Staff
        </a>

    </nav>

</header>



<main class="auth-container">

    <section class="auth-card">

        <div class="auth-icon">
            👑
        </div>

        <h1>
            Admin Login
        </h1>

        <p>
            Manage Printzy orders, staff and business performance.
        </p>


        <form id="adminLoginForm">

            <label>

                Admin ID

                <input
                    type="text"
                    id="adminUsername"
                    placeholder="Enter admin ID"
                    required
                >

            </label>


            <label>

                Password

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter password"
                    required
                >

            </label>


            <button
                type="submit"
                class="btn primary-btn full"
            >
                👑 Admin Login
            </button>

        </form>


        <p
            id="adminLoginMessage"
            class="message"
        ></p>


        <div class="demo-box">

            <strong>Demo Admin</strong>

            <br><br>

            ID:
            <b>admin</b>

            <br>

            Password:
            <b>printzyadmin</b>

        </div>

    </section>

</main>


<script src="script.js"></script>

</body>
</html>
